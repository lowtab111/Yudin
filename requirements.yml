functional:
  - Пользователь должен иметь возможность искать товары по ключевому слову или категории
  - Пользователь должен иметь возможность фильтровать товары (по цене, бренду, наличию)
  - Пользователь должен иметь возможность просматривать каталог товаров и подробную информацию о товаре
  - Пользователь должен иметь возможность добавлять товары в корзину и просматривать её содержимое
  - Пользователь должен иметь возможность удалять товар из корзины
  - Пользователь должен иметь возможность оформить заказ с переходом на страницу оплаты
  - Пользователь должен иметь возможность переключить язык интерфейса
non-functional:
  - Сайт должен иметь адаптивную верстку для удобства использования на мобильных устройствах
  - Сайт должен быть SPA-приложением и не перезагружать страницу полностью при навигации
  - Сайт должен быть оптимизирован для скорости работы
  - Сайт должен быть безопасным и защищать данные пользователя
  - Сайт должен быть совместим с последними версиями популярных браузеров
  - Сайт должен быть способен обрабатывать большое количество трафика
  - Сайт должен быть доступен для пользователей без использования VPN (прямой доступ из сети Интернет)
implicit:
  - Корзина должна сохраняться при перезагрузке страницы (использование session storage браузера)
  - При добавлении товара в корзину должно появляться визуальное подтверждение действия (например, обновление счетчика или всплывающее уведомление)
  - Цена со скидкой и старая цена должны быть визуально различимы (например, старая цена зачеркнута), рейтинг должен отображаться понятно (звезды или знак %)
  - Приложение должно корректно обрабатывать пустые состояния (например, пустая корзина или отсутствие товаров по заданному фильтру)
