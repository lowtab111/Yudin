- summary: |
    Добавление товара в корзину из каталога
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину
  prerequisites: |
    Открыта главная страница каталога товаров
  test-data: |
    Товар "Essence Mascara Lash Princess"
  steps:
    - Найти товар "Essence Mascara Lash Princess" в каталоге
    - Нажать кнопку "Add to cart" у этого товара
  expected-result: |
    Товар добавлен в корзину. Счетчик корзины в шапке сайта увеличился на 1. Появилось визуальное подтверждение добавления.

- summary: |
    Просмотр содержимого корзины
  requirement: |
    Пользователь должен иметь возможность просматривать содержимое корзины
  prerequisites: |
    В корзине есть хотя бы один добавленный товар
  test-data: |
    Товар "Essence Mascara Lash Princess" уже добавлен в корзину
  steps:
    - Нажать на иконку корзины в шапке сайта
    - Проверить отображение списка товаров на открывшейся странице
  expected-result: |
    Открыта страница корзины. В списке отображается товар "Essence Mascara Lash Princess" с корректным названием, ценой и количеством (1 шт.).

- summary: |
    Удаление товара из корзины
  requirement: |
    Пользователь должен иметь возможность удалить товар из корзины
  prerequisites: |
    Открыта страница корзины, в ней есть добавленный товар
  test-data: |
    Товар "Essence Mascara Lash Princess" находится в корзине
  steps:
    - На странице корзины найти товар "Essence Mascara Lash Princess"
    - Нажать кнопку удаления товара (иконку корзины или кнопку "Remove")
  expected-result: |
    Товар исчез из списка корзины. Общая сумма заказа пересчитана и равна 0. Счетчик товаров в шапке сайта уменьшился до 0.

- summary: |
    Фильтрация товаров по категории
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites: |
    Открыта главная страница каталога товаров
  test-data: |
    Категория "groceries"
  steps:
    - В блоке фильтров слева выбрать категорию "groceries"
    - Дождаться обновления списка товаров
  expected-result: |
    В каталоге отображаются только товары категории "groceries" (например, Apple, Beef Steak). Товары других категорий (beauty, furniture) отсутствуют.

- summary: |
    Проверка сохранения корзины при перезагрузке страницы
  requirement: |
    Корзина хранится в сессии браузера
  prerequisites: |
    В корзине есть добавленный товар
  test-data: |
    Товар "Essence Mascara Lash Princess" добавлен в корзину
  steps:
    - Добавить товар в корзину
    - Перезагрузить страницу браузера (нажать F5 или кнопку обновления)
  expected-result: |
    После перезагрузки страницы товар остается в корзине, счетчик корзины в шапке сохраняет актуальное значение (1).
