- summary: |
    Некорректное отображение цены, скидки и рейтинга товара в каталоге
  environment: |
    Google Chrome 155.0.8059.39 (официальная сборка) (x86_64)
    ОС Ubuntu 22.04.5 LTS
    URL: https://products-store.hexlet.app/
  steps-to-reproduce: |
    1. Открыть главную страницу каталога https://products-store.hexlet.app/
    2. Проскроллить до списка товаров
    3. Обратить внимание на блок с ценой и рейтингом под названием товара
  expected-result: |
    Цена без скидки, цена со скидкой и рейтинг отображаются раздельно, с понятными отступами и форматированием (например, старая цена зачеркнута).
  actual-result: |
    Данные сливаются в одну строку без пробелов и форматирования. Например: "9.99$8.94$99Add to cart". Невозможно быстро считать информацию о скидке и рейтинге.

- summary: |
    Корзина очищается при перезагрузке страницы
  environment: |
    Google Chrome 155.0.8059.39 (официальная сборка) (x86_64)
    ОС Ubuntu 22.04.5 LTS
    URL: https://products-store.hexlet.app/
  steps-to-reproduce: |
    1. Открыть главную страницу каталога
    2. Добавить любой товар в корзину (нажать "Add to cart")
    3. Убедиться, что счетчик корзины увеличился
    4. Перезагрузить страницу (нажать F5 или кнопку обновления браузера)
  expected-result: |
    Товар остается в корзине, счетчик корзины сохраняет актуальное значение (согласно требованию о хранении в сессии браузера).
  actual-result: |
    После перезагрузки страницы корзина пуста, счетчик товаров сбрасывается до 0.

- summary: |
    Отсутствует возможность переключения языка интерфейса
  environment: |
    Google Chrome 155.0.8059.39 (официальная сборка) (x86_64)
    ОС Ubuntu 22.04.5 LTS
    URL: https://products-store.hexlet.app/
  steps-to-reproduce: |
    1. Открыть главную страницу приложения
    2. Осмотреть шапку сайта (header) и подвал (footer) на наличие переключателя языка (RU/EN)
  expected-result: |
    Присутствует элемент управления (кнопка или выпадающий список) для переключения языка интерфейса между русским и английским.
  actual-result: |
    Элемент переключения языка отсутствует. Интерфейс доступен только на английском языке.
