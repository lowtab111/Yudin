bugreports:
  - summary: |
      Отсутствует возможность переключения языка интерфейса
    environment: |
      Google Chrome 155.0.8059.39 (официальная сборка) (x86_64)
      ОС Ubuntu 22.04.5 LTS
      URL: https://products-store.hexlet.app/
    steps-to-reproduce: |
      1. Открыть главную страницу приложения
      2. Осмотреть шапку сайта (header) и подвал (footer) на наличие переключателя языка (RU/EN)
    expected-result: |
      Присутствует элемент управления для переключения языка интерфейса между русским и английским.
    actual-result: |
      Элемент переключения языка отсутствует. Интерфейс доступен только на английском языке.
